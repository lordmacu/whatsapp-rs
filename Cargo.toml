[package]
name          = "wa-agent"
version       = "0.1.7"
edition       = "2021"
rust-version  = "1.88"
description   = "WhatsApp multi-device client library — Signal-protocol 1:1 + groups, media, polls, view-once, scheduler, and an agent runtime for LLM / webhook / voice-note bots."
license       = "MIT OR Apache-2.0"
repository    = "https://github.com/lordmacu/whatsapp-rs"
homepage      = "https://github.com/lordmacu/whatsapp-rs"
readme        = "README.md"
keywords      = ["whatsapp", "messaging", "bot", "signal", "agent"]
categories    = ["api-bindings", "network-programming", "asynchronous"]
authors       = ["Cristian García <informacion@cristiangarcia.co>"]

# Files excluded from the `cargo package` tarball (what crates.io serves).
# Keeps the bundle small and free of local-dev detritus.
exclude = [
    "/Baileys",
    "/whatsmeow",
    "/proto",
    "/.codex",
    "/.env",
    "/agent-state",
    "/agent-state-offhours",
    "/.worktrees",
    "/.whatsapp-rs",
    "/target",
    "/PENDIENTES.md",
    "/bible_*.json",
    "/captura_*",
    "/*.log",
    "/docs/superpowers",
]

[[bin]]
name = "whatsapp-rs"
path = "src/main.rs"

[lib]
name = "whatsapp_rs"
path = "src/lib.rs"

[features]
# Default keeps the existing behaviour — `tokio-tungstenite` uses
# OpenSSL via `native-tls` so downstream consumers that already
# build against system OpenSSL (the proyecto daemon, every existing
# bot example) compile byte-equivalently to before this feature
# split landed.
default = ["native-tls"]

# OpenSSL TLS stack via `tokio-tungstenite`. Requires libssl
# headers at build time — the historical default for Linux server
# deploys.
native-tls = ["tokio-tungstenite/native-tls"]

# Pure-rustls TLS stack with the webpki-roots CA bundle. No
# OpenSSL dependency at build time, so the binary cross-compiles
# cleanly to Android NDK / Termux / any musl target without
# pre-built OpenSSL artefacts. Required by the Phase 90 mobile
# (Android Flutter) embedded build of the Nexo daemon's WhatsApp
# plugin. Mutually exclusive with `native-tls`; consumers that
# pin this feature must also pass `default-features = false` to
# disable the OpenSSL default.
rustls-tls = ["tokio-tungstenite/rustls-tls-webpki-roots"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket — TLS backend selected by the cargo features above.
# `default-features = false` keeps `connect` + `handshake` while
# leaving the TLS choice to the feature gate.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }

# Crypto - Noise protocol
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"

# Crypto - Signal protocol
hmac = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
pbkdf2 = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
xeddsa = "=1.0.2"   # 1.1 broke API: switched to rand_core::CryptoRng (OsRng no longer impls it)

# Protobuf
prost = "0.13"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = { version = "0.22", features = ["std"] }

# QR code display en terminal
qrcode = "0.14"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
bytes = "1"
anyhow = "1"
thiserror = "1"
futures-util = "0.3"
flate2 = "1"
hex = "0.4"
md5 = "0.7"
dirs = "5"

# HTTP client (media download)
reqwest = { version = "0.12", features = ["rustls-tls", "multipart"], default-features = false }

# HTTP server for QR endpoint
axum = "0.7"

[build-dependencies]
prost-build = "0.13"

# Tuned release for the chat workspace machine. Trade ~5 % runtime
# perf for parallel codegen + no LTO so iteration is ~2× faster.
# Reserve plain `--release` (override via -p flag) for publish.
[profile.release]
opt-level     = 3
lto           = "thin"
strip         = "symbols"

[profile.release-fast]
inherits      = "release"
lto           = false
codegen-units = 16
strip         = "none"
